[package]
name = "rexinator"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Start Rex terminal sessions from YAML project files, like tmuxinator for tmux"
repository = "https://github.com/alvgaona/rexinator"
readme = "README.md"
keywords = ["rex", "tmuxinator", "terminal", "session", "workspace"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/README.md", "/LICENSE-*", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
anstream = "1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
