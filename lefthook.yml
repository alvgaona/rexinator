commit-msg:
  commands:
    commitlint:
      run: pixi run -e lint commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: rustfmt --edition 2024 --check {staged_files}
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
